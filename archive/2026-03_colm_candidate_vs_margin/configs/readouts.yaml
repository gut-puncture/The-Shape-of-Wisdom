readouts:
  - id: semantic_exact
    kind: semantic_option_text
    normalization: mean_logprob
    primary: true
  - id: templated_semantic
    kind: templated_semantic
    template: "The answer is {option_text}"
    normalization: mean_logprob
    primary: false
  - id: letter_label
    kind: letter_label
    template: "{label}"
    normalization: mean_logprob
    primary: false

